notes: >-
  Zerion's first-party developer tooling ships from the open-source
  github.com/zeriontech/zerion-ai repository as the `zerion-cli` npm package.
  Zerion does not publish per-language REST SDKs; the API is called directly
  over HTTP (Basic auth) with the documented cURL/JS/Python/Go snippets. The CLI
  wraps the API plus a local encrypted wallet vault and is the recommended
  client for agents.
