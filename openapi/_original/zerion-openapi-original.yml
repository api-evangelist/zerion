  /v1/wallet-sets/charts/{chart_period}:
    get:
      operationId: getWalletSetChart
      summary: Get wallet set balance chart
      description: >
        This endpoint returns a portfolio balance chart for a wallet set.

        A wallet set is represented by an EVM address, a Solana address, or
        both. At least one address must be provided.

        This is over a specified time period, based on the provided start and
        end timestamps.

        Results can be filtered by blockchain and asset type, offering flexible
        and detailed visualizations of wallet set performance, similar to what
        you see in the Zerion interface.


        **Complex positions.** By default the chart counts only simple
        positions: token and native-coin balances held directly in the wallet.
        Set `filter[positions]` to `only_complex` or `no_filter` to also include
        complex DeFi protocol positions. Uniswap V2 LP positions are supported
        today, and support for more protocols is rolling out over time.
        Positions from protocols that aren't yet supported are omitted from the
        chart.
      tags:
        - wallet sets
      parameters:
        - $ref: '#/components/parameters/WalletSetAddresses'
        - $ref: '#/components/parameters/ChartPeriod'
        - $ref: '#/components/parameters/Currency'
        - name: filter[chain_ids]
          in: query
          style: form
          explode: false
          description: >-
            Account only for balance on these chains (comma-separated list).
            Available chain ids can be found in chains endpoints.
          schema:
            type: array
            example:
              - aurora
            maxItems: 25
            items:
              type: string
        - name: filter[fungible_ids]
          in: query
          style: form
          explode: false
          description: >-
            Account only for balance of given fungible assets (comma-separated
            list). Mutually exclusive with `filter[exclude_fungible_ids]` —
            combining both returns `400`.
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              maxLength: 44
        - name: filter[exclude_fungible_ids]
          in: query
          style: form
          explode: false
          description: >-
            Exclude balance contributions from the given fungible assets
            (comma-separated list). Useful when the set you want to keep is
            large but the set you want to omit is small. Mutually exclusive with
            `filter[fungible_ids]` — combining both returns `400`.
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              maxLength: 44
        - name: filter[pool_addresses]
          in: query
          style: form
          explode: false
          description: >-
            Restrict the balance chart to specific liquidity-pool / vault
            positions, identified by their contract address (comma-separated
            list) — the Uniswap V2 LP-token or ERC-4626 vault (e.g. Morpho)
            address. Only the matching protocol positions are charted; simple
            token and native-coin balances are excluded. These are complex
            (protocol) positions, so passing `filter[positions]=only_simple`
            alongside this filter returns `400`. Mutually exclusive with
            `filter[exclude_pool_addresses]` — combining both returns `400`.
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              maxLength: 44
        - name: filter[exclude_pool_addresses]
          in: query
          style: form
          explode: false
          description: >-
            Exclude specific liquidity-pool / vault positions from the balance
            chart, identified by their contract address (comma-separated list) —
            the Uniswap V2 LP-token or ERC-4626 vault (e.g. Morpho) address. The
            matching positions are removed; the rest of the portfolio (including
            simple balances) is kept. These are complex (protocol) positions, so
            passing `filter[positions]=only_simple` alongside this filter —
            which would already drop every protocol position, making the
            exclusion a no-op — returns `400`. Mutually exclusive with
            `filter[pool_addresses]` — combining both returns `400`.
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              maxLength: 44
        - name: filter[positions]
          in: query
          style: form
          explode: false
          description: >
            Which positions to include in the balance chart.

            - `only_simple` (default) — simple positions only: wallet token and
            native-coin balances.

            - `only_complex` — complex DeFi protocol positions only (e.g.
            liquidity-pool and vault positions).

            - `no_filter` — include both simple and complex positions.


            Uniswap V2 LP positions are supported today, and support for more
            protocols is rolling out over time.
          schema:
            type: string
            default: only_simple
            enum:
              - only_simple
              - only_complex
              - no_filter
      responses:
        '200':
          $ref: '#/components/responses/ChartsResponse-2'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/wallet-sets/pnl:
    get:
      operationId: getWalletSetPNL
      summary: Get wallet set PnL
      description: >
        This endpoint returns the Profit and Loss (PnL) details of a wallet set.

        A wallet set is represented by an EVM address, a Solana address, or
        both. At least one address must be provided.

        This includes Unrealized PnL, Realized PnL, Net Invested amounts and
        filters for asset categories like Non Fungible Tokens (NFTs).

        It uses the FIFO (First In, First Out) standard for calculations,
        providing accurate insights into wallet set performance.

        Ideal for tracking and analyzing financial outcomes of wallet activity
        across multiple addresses.


        The very first request for a wallet set might result in a 503 which
        should be retried later.

        Wallet sets with over 1 million transactions are not supported.
      tags:
        - wallet sets
      parameters:
        - $ref: '#/components/parameters/WalletSetAddresses'
        - $ref: '#/components/parameters/Currency'
        - name: filter[chain_ids]
          in: query
          style: form
          explode: false
          description: Calculate PnL only for specified chains (comma-separated list).
          schema:
            type: array
            example:
              - ethereum
              - polygon
            maxItems: 25
            items:
              type: string
        - name: filter[fungible_ids]
          in: query
          style: form
          explode: false
          description: >
            Account only for PnL related to given fungible assets
            (comma-separated list). Maximum of 100 fungible IDs allowed.


            When filtering by fungible_ids or fungible_implementations, assets
            without available prices are automatically excluded from
            calculations instead of causing an error. Excluded assets are
            returned in the response metadata for transparency.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 44
        - name: filter[fungible_implementations]
          in: query
          style: form
          explode: false
          description: >
            Account only for PnL related to given fungible asset implementations
            (comma-separated list of chain:address pairs). Maximum of 100
            implementations allowed.

            example:
            "base:0xae16c445d8a4082cecb49a9465e4dd5499df947d,ethereum:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"


            When filtering by fungible_ids or fungible_implementations, assets
            without available prices are automatically excluded from
            calculations instead of causing an error. Excluded assets are
            returned in the response metadata for transparency.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: since
          in: query
          required: false
          description: >-
            Only account sales since the given date.

            A unix timestamp in milliseconds.

            **Note:** PnL is pre-computed at standard marks (`now`, `1 day ago`,
            `1 week ago`, `1 month ago`, `1 year ago`, `beginning of the year`).
            Other values are supported only if fewer than 3,000 transactions sit
            between your timestamp and the nearest mark — otherwise the request
            errors out.
          schema:
            type: string
            example: '1688842525735'
            minLength: 13
            maxLength: 13
        - name: till
          in: query
          required: false
          description: >-
            Only account sales till the given date.

            A unix timestamp in milliseconds.

            **Note:** PnL is pre-computed at standard marks (`now`, `1 day ago`,
            `1 week ago`, `1 month ago`, `1 year ago`, `beginning of the year`).
            Other values are supported only if fewer than 3,000 transactions sit
            between your timestamp and the nearest mark — otherwise the request
            errors out.
          schema:
            type: string
            example: '1688842525735'
            minLength: 13
            maxLength: 13
      responses:
        '200':
          $ref: '#/components/responses/PNLResponse-2'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RetryAfter'
  /v1/wallet-sets/portfolio:
    get:
      operationId: getWalletSetPortfolio
      summary: Get wallet set portfolio
      description: >
        This endpoint returns a wallet set's portfolio overview.

        A wallet set is represented by an EVM address, a Solana address, or
        both. At least one address must be provided.


        **Temporary limitations for Solana addresses:**

        - Doesn't support protocol positions


        > NOTE: Don't forget to stop retries after some reasonable period of
        time. If the `200` status is not returned within 2 minutes it most
        probably means that some unexpected error occurred and the client should
        stop the polling.


        > NOTE: Consider all IDs as abstract strings, without making any
        assumptions about their format or relying on such assumptions. There is
        a non-zero probability that IDs may change in the future, and this
        should not result in any breaking changes.
      tags:
        - wallet sets
      parameters:
        - $ref: '#/components/parameters/WalletSetAddresses'
        - name: filter[positions]
          in: query
          required: false
          description: >
            This parameter allows to customize the aggregation of DeFi positions
            within a portfolio based on their types. The aggregation can
            include:

              - `only_simple`: Only includes wallet-type positions, which are basic, non-protocol related assets. This is the default selection if the parameter is not specified.
              - `only_complex`: Aggregates positions associated with DeFi protocols only (e.g., staked assets, liquidity pools), like Uniswap or Aave, excluding simple wallet positions.
              - `no_filter`: Provides an aggregated view of both protocol-related and simple wallet positions without any filtering.

            The selection of filters affects the composition of the aggregated
            portfolio results, allowing for tailored analysis and reporting
            based on the types of positions of interest.


            > ⚠️ Note: Enterprise usage of this API may be subject to different
            pricing models depending on the selected filter type. For detailed
            pricing information, please contact `api@zerion.io`.
          schema:
            type: string
            default: only_simple
            enum:
              - only_simple
              - only_complex
              - no_filter
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          $ref: '#/components/responses/PortfolioResponse-2'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/wallet-sets/positions/:
    get:
      operationId: listWalletSetPositions
      summary: Get wallet set fungible positions
      description: >
        This endpoint returns a list of wallet set positions.

        A wallet set is represented by an EVM address, a Solana address, or
        both. At least one address must be provided.


        This endpoint supports testnets. To get data for testnets use `X-Env`
        header.


        **Understanding Liquidity Pool Positions:**


        Liquidity pools (Uniswap, Curve, Balancer, etc.) return **multiple
        positions** - one for each token in the pool. Positions belonging to the
        same pool share the same `group_id` value in attributes.


        For example, a Uniswap V2 USDC/WETH pool returns two positions:

        - Position 1: WETH token,
        `group_id="820ee2f1ca8ccb716f6beb5e450908a028be890ec44aba87c739b416ef41e197"`,
        `fungible_info.symbol="WETH"`

        - Position 2: USDC token,
        `group_id="820ee2f1ca8ccb716f6beb5e450908a028be890ec44aba87c739b416ef41e197"`,
        `fungible_info.symbol="USDC"`


        To display all tokens in a liquidity pool together, group positions by
        their `group_id` attribute.


        **Temporary limitations for Solana addresses:**

        - Doesn't support protocol positions


        > NOTE: Don't forget to stop retries after some reasonable period of
        time. If the `200` status is not returned within 2 minutes it most
        probably means that some unexpected error occurred and the client should
        stop the polling.


        > NOTE: This endpoint is not paginated and returns all matching
        positions in a single response. It supports a lot of filters and sorting
        parameters, so make sure that a request URL length is in a safe range
        for your platform. Usually, 2000 characters are the safe limit in
        virtually any combination of client and server software.


        > NOTE: Consider all IDs as abstract strings, without making any
        assumptions about their format or relying on such assumptions. There is
        a non-zero probability that IDs may change in the future, and this
        should not result in any breaking changes.
      tags:
        - wallet sets
      parameters:
        - $ref: '#/components/parameters/WalletSetAddresses'
        - name: filter[positions]
          in: query
          required: false
          description: >
            This parameter allows users to filter DeFi positions based on their
            types. There are three options:


            - `only_simple`: Retrieves exclusively wallet-type positions. These
            are basic, non-protocol related positions. This option is applied if
            parameter is not specified.

            - `only_complex`: Fetches only positions associated with all DeFi
            protocols (including staked assets, liquidity pools, etc), like
            Uniswap or Aave. This option excludes simple wallet positions.

            - `no_filter`: Applies no filtering, thus returning both
            protocol-related and simple wallet positions.


            > ⚠️ Note: Different pricing models are applied for enterprise usage
            of this API, depending on the filter type selected. For detailed
            pricing information, please reach out to us at `api@zerion.io`.
          schema:
            type: string
            default: only_simple
            enum:
              - only_simple
              - only_complex
              - no_filter
        - $ref: '#/components/parameters/Currency'
        - name: filter[position_types]
          in: query
          style: form
          explode: false
          description: >
            Keep only positions with these types (comma-separated list).


            Possible values:

            - `deposit` - Assets deposited into a DeFi protocol (e.g., supplied
            to lending pools, deposited in vaults, or provided as liquidity)

            - `loan` - Borrowed assets representing a debt position that needs
            to be repaid

            - `locked` - Assets locked for a specific period or purpose (e.g.,
            vote-escrowed tokens, time-locked tokens)

            - `staked` - Assets staked in a protocol to earn rewards,
            participate in consensus, or for governance purposes

            - `reward` - Earned rewards that are claimable or have been
            distributed but not yet withdrawn

            - `wallet` - Regular assets held directly in the wallet, not
            actively deposited in any protocol

            - `investment` - Investment positions such as tokenized funds,
            indices, or structured products
          schema:
            type: array
            maxItems: 8
            items:
              $ref: '#/components/schemas/PositionType'
        - name: filter[chain_ids]
          in: query
          style: form
          explode: false
          description: >-
            Keep only positions from these chains (comma-separated list).
            Available chain ids can be found in chains endpoints.
          schema:
            type: array
            example:
              - polygon
            maxItems: 25
            items:
              type: string
        - name: filter[fungible_ids]
          in: query
          style: form
          explode: false
          description: >-
            Keep only positions related to given fungible assets
            (comma-separated list).
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              maxLength: 44
        - name: filter[dapp_ids]
          in: query
          style: form
          explode: false
          description: >-
            Keep only positions related to these decentralized applications
            (dapps) (comma-separated list).
          schema:
            type: array
            example:
              - polygon
            maxItems: 25
            items:
              type: string
              maxLength: 32
              minLength: 1
        - name: filter[trash]
          in: query
          required: false
          description: >-
            Filter positions based on the `is_trash` flag. If no flag is
            specified, then `only_non_trash` is applied.
          schema:
            type: string
            default: only_non_trash
            enum:
              - only_trash
              - only_non_trash
              - no_filter
        - name: sort
          in: query
          required: false
          description: Choose how the result should be ordered
          schema:
            type: string
            default: value
            enum:
              - '-value'
              - value
        - name: X-Env
          in: header
          description: Custom header that allows you to get data for testnets.
          required: false
          schema:
            type: string
            enum:
              - testnet
      responses:
        '200':
          $ref: '#/components/responses/PositionsListResponse-2'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/wallet-sets/transactions/:
    get:
      operationId: listWalletSetTransactions
      summary: Get wallet set transactions
      description: >
        This endpoint returns a list of transactions associated with the wallet
        set.

        A wallet set is represented by an EVM address, a Solana address, or
        both. At least one address must be provided.


        This endpoint supports testnets. To get data for testnets use `X-Env`
        header.


        **Temporary limitations for Solana addresses:**

        - Doesn't support NFT transactions


        > NOTE: This endpoint supports a lot of filters, sorting, and pagination
        parameters. Make sure that your request URL length is safe for your
        platform. Usually, 2000 characters are the safe limit in virtually any
        combination of client and server software.


        > NOTE: Consider all IDs as abstract strings, without making any
        assumptions about their format or relying on such assumptions. There is
        a non-zero probability that IDs may change in the future, and this
        should not result in any breaking changes.
      tags:
        - wallet sets
      parameters:
        - $ref: '#/components/parameters/WalletSetAddresses'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/Page'
        - name: filter[search_query]
