  /v1/swap/quotes/:
    get:
      operationId: swapQuotes
      summary: Get swap and bridge quotes
      description: >
        Returns quotes from multiple liquidity sources for a same-chain swap or
        a cross-chain bridge between two fungible assets. Supports EVM chains
        and Solana, including EVM ↔ Solana bridges.


        Quotes are returned best-first: sorted in descending order by the fiat
        value of `output_amount_after_fees` (output amount minus network,
        protocol and bridge fees that are not already included in the rate).
        Quotes with the same score are tied-broken alphabetically by
        `liquidity_source.id`, so identical requests always return quotes in the
        same order.


        The `input` and `output` parameters are objects encoded with bracket
        notation in the URL — the request is sent as a flat query string. For
        example:


        ```

        GET
        /v1/swap/quotes/?currency=usd&input[chain_id]=base&input[fungible_id]=0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2&input[amount]=0.001&output[fungible_id]=0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48&from=0xd8da6bf26964af9d7eed9e03e53415d37aa96045&to=0xd8da6bf26964af9d7eed9e03e53415d37aa96045

        ```
      tags:
        - swap
      parameters:
        - name: currency
          in: query
          required: false
          description: >-
            Currency in which fiat values of amounts and fees in the response
            are expressed.
          example: usd
          schema:
            type: string
            default: usd
        - name: from
          in: query
          required: true
          description: >-
            Address of the wallet performing the swap. Must match the chain type
            of `input[chain_id]` (EVM hex or Solana base58).
          example: '0x42b9df65b219b3dd36ff330a4dd8f327a6ada990'
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: >-
            Recipient of the output asset. Must match the chain type of
            `output[chain_id]`. For a same-chain swap to the same wallet, set
            `to` equal to `from`.
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          schema:
            type: string
        - name: input
          in: query
          required: true
          description: The asset being sent.
          style: deepObject
          explode: true
          schema:
            type: object
            required:
              - chain_id
              - fungible_id
              - amount
            properties:
              chain_id:
                type: string
                description: Chain ID the input asset lives on.
                example: base
              fungible_id:
                type: string
                description: Unique fungible ID of the input asset.
                minLength: 3
                maxLength: 44
                example: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
              amount:
                type: string
                description: >-
                  Human-readable input amount as a positive decimal (not in the
                  smallest unit).
                example: '0.001'
        - name: output
          in: query
          required: true
          description: The asset being received.
          style: deepObject
          explode: true
          schema:
            type: object
            required:
              - fungible_id
            properties:
              chain_id:
                type: string
                description: >-
                  Chain ID the output asset lives on. Defaults to
                  `input[chain_id]` (same-chain swap).
                example: base
              fungible_id:
                type: string
                description: Unique fungible ID of the output asset.
                minLength: 3
                maxLength: 44
                example: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
        - name: slippage_percent
          in: query
          required: false
          description: >-
            Maximum acceptable slippage in percent. When omitted, an
            auto-slippage value is chosen.
          example: 2
          schema:
            type: number
            format: float
            minimum: 0
      responses:
        '200':
          $ref: '#/components/responses/SwapQuotesResponse'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/swap/fungibles/:
    get:
      operationId: swapFungibles
      summary: List fungibles available for bridging
      description: >-
        Returns the list of tokens available for bridging between two chains.
        Use this to populate a token picker UI. Only relevant for cross-chain
        swaps, same-chain swaps don't require this step.
      tags:
        - swap
      parameters:
        - name: input
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              chain_id:
                type: string
                description: >-
                  Initial chain id the user want exchange fungibles from. If
                  nothing specified then `ethereum` is used.
                example: ethereum
        - name: output
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              chain_id:
                type: string
                description: >-
                  Target chain id the user want receive fungibles on. If nothing
                  specified then `ethereum` is used.
                example: polygon
        - name: direction
          in: query
          description: >-
            The direction parameter is a parameter that determines the flow of
            fungibles involved in the transaction. It can have three possible
            values: 'input', 'output', or 'both'. The value 'input' indicates
            that the API endpoint will only return fungibles that the user can
            send. The value 'output' indicates that the API endpoint will only
            return fungibles that the user can receive. The value 'both' means
            that the API endpoint will return fungibles which are 'input' and
            'output' at the same time. In other words - intersection for 'input'
            and output'. If nothing specified then `both` is used.
          example: both
          schema:
            type: string
            enum:
              - input
              - output
              - both
      responses:
        '200':
          $ref: '#/components/responses/SwapFungiblesResponse'
        '400':
          $ref: '#/components/responses/MalformedParameters'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/gas-prices/:
    get:
      operationId: listGasPrices
      summary: Get list of all available gas prices
      description: >-
        This endpoint provides real-time information on the current gas prices
        across all supported blockchain networks. Gas prices play a crucial role
        in the speed and cost of executing transactions on a blockchain, and
        fluctuate frequently based on network demand and usage. By using this
        endpoint, developers can stay up-to-date with the latest gas prices and
        adjust their application's transaction parameters accordingly to ensure
        optimal speed and cost efficiency.
      tags:
