aid: zerion
name: Zerion
description: >-
  Zerion is an Ethereum and Solana wallet and developer platform focused on
  making onchain data easy to use. The Zerion API delivers clean, normalized
  wallet data, token analytics, DeFi positions, transaction history, PnL, NFTs,
  gas prices, swap and bridge quotes, and real-time transaction webhooks across
  EVM chains and Solana. The same infrastructure powers the Zerion wallet app
  used by millions. It is a JSON:API REST service with HTTP Basic (API key)
  authentication plus pay-per-request x402 (Base/Solana USDC) and MPP (Tempo
  USDC) options aimed at AI agents, an open-source CLI, six packaged agent
  skills, a hosted MCP server, and Kafka streaming for high-throughput
  pipelines.
